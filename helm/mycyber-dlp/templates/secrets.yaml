{{- /*
Create a Kubernetes Secret from the env values.
Sensitive values like JWT_SECRET_KEY and ENCRYPTION_MASTER_KEY should
be provided via --set or --set-file to avoid storing in values.yaml.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mycyber.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mycyber.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET_KEY: {{ .Values.env.JWT_SECRET_KEY | b64enc | quote }}
  ENCRYPTION_MASTER_KEY: {{ .Values.env.ENCRYPTION_MASTER_KEY | b64enc | quote }}
  SAFEPAY_SECRET_KEY: {{ .Values.env.SAFEPAY_SECRET_KEY | b64enc | quote }}
  SAFEPAY_WEBHOOK_SECRET: {{ .Values.env.SAFEPAY_WEBHOOK_SECRET | b64enc | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mycyber.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mycyber.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.env.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  ENCRYPTION_KEY_VERSION: {{ .Values.env.ENCRYPTION_KEY_VERSION | quote }}
  ENCRYPTION_AT_REST_ENABLED: {{ .Values.env.ENCRYPTION_AT_REST_ENABLED | quote }}
  ENCRYPTION_KMS_BACKEND: {{ .Values.env.ENCRYPTION_KMS_BACKEND | quote }}
  ENCRYPTION_LEGACY_KEYS: {{ .Values.env.ENCRYPTION_LEGACY_KEYS | quote }}
  DEPLOYMENT_REGION: {{ .Values.env.DEPLOYMENT_REGION | quote }}
  FRONTEND_URL: {{ .Values.env.FRONTEND_URL | quote }}
